[package]
name = "sm64coin-desktop"
version = "0.5.0"
edition = "2024"
description = "SM64Coin desktop app: the website in a Tauri window with a native node and miner"
license = "BSD-3-Clause"

# Its own workspace (own Cargo.lock), like pow/launcher, which it depends on.
[workspace]

[lib]
name = "sm64coin_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "sm64coin-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
sm64coin-launcher = { path = "../../pow/launcher" }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

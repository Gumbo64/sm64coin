[package]
name = "sm64coin-desktop"
version = "0.5.0"
edition = "2024"
description = "SM64Coin desktop app: the website in a Tauri window with a native node and miner"
license = "BSD-3-Clause"

# Its own workspace (own Cargo.lock), like pow/launcher, which it depends on.
[workspace]

[lib]
name = "sm64coin_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"] # staticlib/cdylib: the Android (and iOS) entry point

[[bin]]
name = "sm64coin-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sm64coin-launcher = { path = "../../pow/launcher", default-features = false, features = ["tls"] }
# The light-client crate: failover Client over HTTP and iroh nodes (lcnet.rs). No service/relay here (that is the node's side).
sm64coin-lc = { path = "../../pow/lc", features = ["http", "tls", "iroh-client"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
hex = "0.4"
# the passkey hand-off (link.rs), desktop and Android; sha2 (wallet.rs hashing) too
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
tiny_http = "0.12"
hkdf = "0.12"
zeroize = "1"
getrandom = "0.2"
sha2 = "0.10"

# Android only: links to web pages open in the system browser (the app's window never leaves its own pages); the native miner
# is the sm64coin-miner library (Campaign, in this process; pow/miner/README.md).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
sm64coin-miner = { path = "../../pow/miner" }
sha1 = "0.10"
base64 = "0.22"

# The host's tests run the Android miner core (src/mobile_miner.rs) against an isolated offline node.
[dev-dependencies]
# lcnet_test.rs: lc services and a local relay in front of isolated offline nodes (the app itself only links the client side)
sm64coin-lc = { path = "../../pow/lc", features = ["server", "relay"] }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
sm64coin-miner = { path = "../../pow/miner" }
sha1 = "0.10"
base64 = "0.22"

# Desktop only: processes, files, dialogs (the launcher's `desktop` feature is what builds its node/ROM/DHT parts).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sm64coin-launcher = { path = "../../pow/launcher", default-features = false, features = ["desktop", "tls"] }
sm64coin-lc = { path = "../../pow/lc", features = ["dht"] }
tauri-plugin-dialog = "2"
ctrlc = { version = "3", features = ["termination"] }
ureq = { version = "2", default-features = false, features = ["json"] }
md-5 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true

# The game's engine (Android's native miner) is compute-bound: full optimisation for it and the search, size for the rest.
[profile.release.package.sm64coin-miner]
opt-level = 3
[profile.release.package.sm64pow]
opt-level = 3
[profile.release.package.sm64-binds]
opt-level = 3
[profile.release.package.obrrt-core]
opt-level = 3
[profile.release.package.obrrt-search]
opt-level = 3
[profile.release.package.obrrt-objectives]
opt-level = 3
[profile.release.package.obrrt-spec]
opt-level = 3
[profile.release.package.wasmer]
opt-level = 3
[profile.release.package.wasmer-vm]
opt-level = 3
[profile.release.package.wasmer-types]
opt-level = 3
[profile.release.package.wasmer-compiler]
opt-level = 3
[profile.release.package.wasmer-compiler-cranelift]
opt-level = 3
[profile.release.package.cranelift-codegen]
opt-level = 3
[profile.release.package.rayon]
opt-level = 3
[profile.release.package.rayon-core]
opt-level = 3

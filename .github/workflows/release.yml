name: Release

# Push a tag v<version> (e.g. v0.1.0): builds the bundles, writes SHA256SUMS and publishes a
# GitHub release. "Run workflow" (workflow_dispatch) is a dry run: it builds everything and
# keeps the bundles as workflow artifacts, but publishes nothing.
#
# Platforms: Linux x86_64, Linux aarch64 (Raspberry Pi 4/5, 64-bit OS), Windows x86_64 (MSYS2
# UCRT64), macOS arm64 (Apple silicon, Homebrew). A push to the branch `release-test` is a dry
# run too (nothing is published); only a v* tag publishes.

on:
  push:
    tags: ['v*']
    branches: ['release-test']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the dry-run bundles'
        default: '0.0.0-dryrun'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.0.0-test' }}

jobs:
  wallet-engine:
    uses: ./.github/workflows/wallet-engine.yml

  web:
    name: Website
    needs: wallet-engine
    if: ${{ !cancelled() }}   # the site is built even when the wallet engine failed to build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the replay player and its dependencies (sibling checkouts)
        run: scripts/ci-prepare.sh --web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow/perturb-wasm
            pow/webminer
          key: wasm
      # The web miner (pow/webminer) needs clang for wasm32 (zstd-sys) and the obrrt crates from
      # Gumbo64/sm64-AI-binds. If that repo is private, add the repo secret SM64_AI_BINDS_TOKEN
      # (a read-only token); without it the git fetch is anonymous. A failed web miner build (REQUIRE_WEBMINER=1 below)
      # fails this job.
      - name: Toolchain for the web miner (clang, llvm, private repo access)
        continue-on-error: true
        env:
          SM64_AI_BINDS_TOKEN: ${{ secrets.SM64_AI_BINDS_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          if [ -n "$SM64_AI_BINDS_TOKEN" ]; then
            git config --global url."https://x-access-token:${SM64_AI_BINDS_TOKEN}@github.com/Gumbo64/".insteadOf "https://github.com/Gumbo64/"
          fi
      - name: Browser WASM modules (perturbation, web miner)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          REQUIRE_WEBMINER: "1"   # the site and the bundles ship the browser miner: a failed build fails the job
        run: npm install -g wasm-pack@0.13.1 && scripts/build-wasm.sh
      - name: Wallet engine (wasm); without it the Wallet page says it is unavailable
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wallet-engine
          path: web/public/wallet
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_SM64COIN_VERSION: ${{ env.VERSION }}   # the site's "update available" check compares it with the latest release
          VITE_GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.platform }}
    needs: web
    if: ${{ !cancelled() }}   # dry runs build the programs even when the website job fails
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) so the bundles also run on Raspberry Pi OS Bookworm
          # (glibc 2.36), Debian 12, Ubuntu 22.04 and anything newer.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: System packages
        run: |
          sudo rm -rf /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache git curl ca-certificates patchelf zip \
            libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind-dev liblzma-dev \
            libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev \
            libprotobuf-dev protobuf-compiler libudev-dev libboost-all-dev libgcrypt20-dev libgpg-error-dev \
            qtbase5-dev qtdeclarative5-dev qtbase5-dev-tools qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev qtmultimedia5-dev libqt5multimedia5-plugins qtquickcontrols2-5-dev \
            libqt5xmlpatterns5-dev libqt5opengl5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls qml-module-qtquick-controls2 \
            qml-module-qtquick-dialogs qml-module-qtquick-layouts qml-module-qtquick-window2 \
            qml-module-qt-labs-platform qml-module-qt-labs-settings qml-module-qt-labs-folderlistmodel \
            qml-module-qtgraphicaleffects qml-module-qtmultimedia qml-module-qtqml-models2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow
          key: ${{ matrix.platform }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-

      - name: Prepare the workspace
        run: scripts/ci-prepare.sh

      - name: Leaderboard server (Rust)
        run: scripts/ci-run.sh leaderboard bash -c 'cd pow && cargo build --release -p sm64coin-leaderboard'

      - name: AutoMiner (Rust; the campaign's tree search runs in its rrtrun child)
        run: scripts/ci-run.sh automine bash -c 'cd pow && cargo build --release -p sm64coin-miner --bin automine --bin rrtrun'
        env:
          SM64COIN_VERSION: ${{ env.VERSION }}   # compiled into automine for its "update available" log line

      # One CMake tree builds everything: the wallet app's tree contains the daemon (monerod) and
      # libwallet (gui/SM64COIN.md), so the wallet CLI and RPC server are just two more targets
      # of it. ARCH=default: no -march=native, the bundle must run on other CPUs than the runner's.
      - name: Daemon, wallets and wallet app (C++, Qt)
        run: |
          [ -d gui/external/quirc/.git ] || { git clone https://github.com/dlbeer/quirc gui/external/quirc && git -C gui/external/quirc checkout 927d680904dc95fdff4cd9d022eb374b438ff8f2; }
          mkdir -p gui/build && cd gui/build
          ../../scripts/ci-run.sh cmake-configure cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=default -DMANUAL_SUBMODULES=1 -DSM64COIN_VERSION="${VERSION#v}" \
                -DUSE_DEVICE_TREZOR=OFF -DWITH_UPDATER=OFF -DWITH_DESKTOP_ENTRY=OFF -DWITH_SCANNER=OFF -DBUILD_TESTS=OFF ..
          ../../scripts/ci-run.sh cmake-build cmake --build . --target all simplewallet wallet_rpc_server -- -k 0
          ls -la bin
        env:
          CI_LOG_DIR: ${{ github.workspace }}/ci-logs

      - name: ccache statistics
        if: always()
        run: ccache -s | head -20 || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}

      - uses: actions/download-artifact@v4
        continue-on-error: ${{ github.ref_type != 'tag' }}   # dry runs go on without the website (placeholder page)
        with:
          name: web-dist
          path: web/dist

      - name: Bundle
        run: scripts/ci-run.sh bundle scripts/package.sh
        env:
          CI_NOTICE: '1'
          VERSION: ${{ env.VERSION }}
          ALLOW_NO_WEB: ${{ github.ref_type != 'tag' && '1' || '' }}
          PLATFORM: ${{ matrix.platform }}
          MONERO_BIN: ${{ github.workspace }}/gui/build/bin
          CI_LOG_DIR: ${{ github.workspace }}/ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/sm64coin-*.tar.gz
          if-no-files-found: error

      - name: Fetch the ROM (optional)
        id: rom
        run: |
          if [ -n "$ROM_URL" ]; then curl -fsSL --proto '=https' --tlsv1.2 "$ROM_URL" -o "$RUNNER_TEMP/baserom.us.z64" && echo "file=$RUNNER_TEMP/baserom.us.z64" >> "$GITHUB_OUTPUT"; fi
        env:
          ROM_URL: ${{ secrets.ROM_URL }}

      - name: Smoke test (the bundle's programs start; the node script asks for the ROM)
        run: |
          mkdir smoke && tar -xzf dist/sm64coin-*-${{ matrix.platform }}.tar.gz -C smoke
          scripts/ci-run.sh smoke scripts/ci-smoke.sh smoke/sm64coin-*/
        env:
          CI_NOTICE: '1'
          CI_NOTICE_LINES: '70'
          SM64COIN_ROM_FILE: ${{ steps.rom.outputs.file }}
          CI_LOG_DIR: ${{ github.workspace }}/ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.platform }}
          path: ci-logs
          if-no-files-found: ignore

  build-windows:
    name: Build windows-x86_64
    needs: web
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Git settings (no CRLF conversion, long paths, no symlinks)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.symlinks false
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: "gui/monero is a symlink to ../monero, make it a junction"
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force gui\monero -ErrorAction SilentlyContinue
          New-Item -ItemType Junction -Path gui\monero -Target (Resolve-Path monero).Path
          Get-Item gui\monero | Format-List FullName, LinkType, Target

      # Same C++ and Rust toolchain from one place: MSYS2 UCRT64 (upstream's wallet app build uses it too).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            make zip unzip git
          pacboy: >-
            toolchain:p pcre:p cmake:p ninja:p boost:p openssl:p zeromq:p libsodium:p hidapi:p
            protobuf-c:p libusb:p unbound:p qt5:p libgcrypt:p angleproject:p rust:p ccache:p

      - name: Restore caches (ccache, cargo)
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .cargo-home/registry
            pow/target
          key: windows-${{ github.run_id }}
          restore-keys: windows-

      - name: Tool versions
        run: |
          gcc --version | head -1; cmake --version | head -1; cargo --version; rustc -vV | grep host; qmake-qt5 -v | tail -1 || true; ccache --version | head -1

      - name: Prepare the workspace
        run: scripts/ci-prepare.sh

      - name: Leaderboard server (Rust)
        run: scripts/ci-run.sh leaderboard bash -c 'cd pow && cargo build --release -p sm64coin-leaderboard'

      - name: AutoMiner (Rust; the campaign's tree search runs in its rrtrun child)
        run: scripts/ci-run.sh automine bash -c 'cd pow && cargo build --release -p sm64coin-miner --bin automine --bin rrtrun'
        env:
          SM64COIN_VERSION: ${{ env.VERSION }}   # compiled into automine for its "update available" log line

      - name: Daemon, wallets and wallet app (C++, Qt)
        run: |
          cp -f "$MSYSTEM_PREFIX/bin/lrelease-qt5.exe" "$MSYSTEM_PREFIX/bin/lrelease.exe" || true
          [ -d gui/external/quirc/.git ] || { git clone https://github.com/dlbeer/quirc gui/external/quirc && git -C gui/external/quirc checkout 927d680904dc95fdff4cd9d022eb374b438ff8f2; }
          mkdir -p gui/build && cd gui/build
          ../../scripts/ci-run.sh cmake-configure cmake -G Ninja -DSTATIC=OFF -DCMAKE_BUILD_TYPE=Release -DARCH=x86-64 -DBUILD_64=ON -DBUILD_TAG=win-x64 \
                -DMANUAL_SUBMODULES=1 -DSM64COIN_VERSION="${VERSION#v}" -DUSE_DEVICE_TREZOR=OFF -DWITH_UPDATER=OFF -DWITH_SCANNER=OFF -DBUILD_TESTS=OFF ..
          ../../scripts/ci-run.sh cmake-build cmake --build . --target all simplewallet wallet_rpc_server -- -k 0
          ls -la bin

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .cargo-home/registry
            pow/target
          key: windows-${{ github.run_id }}

      # The wallet app needs the Qt DLLs, plugins and QML modules next to it.
      - name: windeployqt
        run: |
          cp -f "$MSYSTEM_PREFIX/bin/qmake-qt5.exe" "$MSYSTEM_PREFIX/bin/qmake.exe"
          cp -f "$MSYSTEM_PREFIX/bin/windeployqt-qt5.exe" "$MSYSTEM_PREFIX/bin/windeployqt.exe"
          cd gui/build/bin
          ../../../scripts/ci-run.sh windeployqt env PATH="$MSYSTEM_PREFIX/bin:$PATH" windeployqt.exe monero-wallet-gui.exe -no-translations -qmldir="$GITHUB_WORKSPACE/gui"
          ls

      - uses: actions/download-artifact@v4
        continue-on-error: ${{ github.ref_type != 'tag' }}   # dry runs go on without the website (placeholder page)
        with:
          name: web-dist
          path: web/dist

      - name: Bundle
        run: scripts/ci-run.sh bundle scripts/package.sh
        env:
          CI_NOTICE: '1'
          VERSION: ${{ env.VERSION }}
          ALLOW_NO_WEB: ${{ github.ref_type != 'tag' && '1' || '' }}
          PLATFORM: windows-x86_64
          MONERO_BIN: ${{ github.workspace }}/gui/build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-windows-x86_64
          path: dist/sm64coin-*.zip
          if-no-files-found: error

      - name: Smoke test (the bundle's programs start; the node script asks for the ROM)
        shell: bash
        run: |
          mkdir smoke && cd smoke && unzip -q ../dist/sm64coin-*-windows-x86_64.zip && cd ..
          if [ -n "$ROM_URL" ]; then curl -fsSL --proto '=https' --tlsv1.2 "$ROM_URL" -o "$RUNNER_TEMP/baserom.us.z64" && export SM64COIN_ROM_FILE="$RUNNER_TEMP/baserom.us.z64"; fi
          scripts/ci-run.sh smoke scripts/ci-smoke.sh smoke/sm64coin-*/
        env:
          CI_NOTICE: '1'
          CI_NOTICE_LINES: '70'
          ROM_URL: ${{ secrets.ROM_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows-x86_64
          path: ci-logs
          if-no-files-found: ignore

  build-macos:
    name: Build macos-arm64
    needs: web
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Homebrew packages
        run: |
          brew install --quiet cmake ninja pkg-config ccache boost hidapi openssl@3 zmq libpgm unbound \
            libunwind-headers protobuf libsodium qt@5 dylibbundler gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow
          key: macos-arm64

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ github.run_id }}
          restore-keys: ccache-macos-arm64-

      - name: Prepare the workspace
        run: scripts/ci-prepare.sh

      - name: Leaderboard server (Rust)
        run: scripts/ci-run.sh leaderboard bash -c 'cd pow && cargo build --release -p sm64coin-leaderboard'

      - name: AutoMiner (Rust; the campaign's tree search runs in its rrtrun child)
        run: scripts/ci-run.sh automine bash -c 'cd pow && cargo build --release -p sm64coin-miner --bin automine --bin rrtrun'
        env:
          SM64COIN_VERSION: ${{ env.VERSION }}   # compiled into automine for its "update available" log line

      - name: Daemon, wallets and wallet app (C++, Qt)
        run: |
          [ -d gui/external/quirc/.git ] || { git clone https://github.com/dlbeer/quirc gui/external/quirc && git -C gui/external/quirc checkout 927d680904dc95fdff4cd9d022eb374b438ff8f2; }
          mkdir -p gui/build && cd gui/build
          ../../scripts/ci-run.sh cmake-configure cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=default -DMANUAL_SUBMODULES=1 -DSM64COIN_VERSION="${VERSION#v}" \
                -DUSE_DEVICE_TREZOR=OFF -DWITH_UPDATER=OFF -DWITH_SCANNER=OFF -DBUILD_TESTS=OFF \
                -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" ..
          ../../scripts/ci-run.sh cmake-build cmake --build . --target all simplewallet wallet_rpc_server -- -k 0
          ls -la bin

      - name: ccache statistics
        if: always()
        run: ccache -s | head -20 || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ github.run_id }}

      # macdeployqt: puts the Qt frameworks, plugins and QML modules into the .app (ad-hoc signed).
      - name: macdeployqt
        run: |
          cd gui/build
          ../../scripts/ci-run.sh macdeployqt cmake --build . --target deploy
          ls -la bin

      - uses: actions/download-artifact@v4
        continue-on-error: ${{ github.ref_type != 'tag' }}   # dry runs go on without the website (placeholder page)
        with:
          name: web-dist
          path: web/dist

      - name: Bundle
        run: scripts/ci-run.sh bundle scripts/package.sh
        env:
          CI_NOTICE: '1'
          VERSION: ${{ env.VERSION }}
          ALLOW_NO_WEB: ${{ github.ref_type != 'tag' && '1' || '' }}
          PLATFORM: macos-arm64
          MONERO_BIN: ${{ github.workspace }}/gui/build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-arm64
          path: dist/sm64coin-*.tar.gz
          if-no-files-found: error

      - name: Smoke test (the bundle's programs start; the node script asks for the ROM)
        run: |
          mkdir smoke && tar -xzf dist/sm64coin-*-macos-arm64.tar.gz -C smoke
          if [ -n "$ROM_URL" ]; then curl -fsSL --proto '=https' --tlsv1.2 "$ROM_URL" -o "$RUNNER_TEMP/baserom.us.z64" && export SM64COIN_ROM_FILE="$RUNNER_TEMP/baserom.us.z64"; fi
          scripts/ci-run.sh smoke scripts/ci-smoke.sh smoke/sm64coin-*/
        env:
          CI_NOTICE: '1'
          CI_NOTICE_LINES: '70'
          ROM_URL: ${{ secrets.ROM_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos-arm64
          path: ci-logs
          if-no-files-found: ignore

  # ---- Desktop app (Tauri 2, desktop/): installers around the same programs the bundles carry ----------------------
  # The app is the website in a webview (web/ built with `--mode desktop`, base '/') plus the bundle's sm64coind, wallet-rpc,
  # automine and rrtrun as sidecars (bundle.externalBin, named per target triple; desktop/stage-sidecars.sh stages them from the
  # per-platform bundle built above, with only the shared libraries they need). The user brings their own ROM.
  # UNSIGNED for now. TODO before a public release: Windows code signing (bundle.windows.signCommand / a certificate),
  # macOS Developer ID signing + notarization (APPLE_CERTIFICATE, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID; the .dmg is only
  # ad-hoc signed through the sidecars' package.sh), tauri-plugin-updater with a signing key, Linux aarch64 and an .rpm.
  web-desktop:
    name: Desktop frontend
    needs: wallet-engine
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the replay player and its dependencies (sibling checkouts)
        run: scripts/ci-prepare.sh --web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow/perturb-wasm
            pow/webminer
          key: wasm
      - name: Toolchain for the web miner (clang, llvm, private repo access)
        continue-on-error: true
        env:
          SM64_AI_BINDS_TOKEN: ${{ secrets.SM64_AI_BINDS_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          if [ -n "$SM64_AI_BINDS_TOKEN" ]; then
            git config --global url."https://x-access-token:${SM64_AI_BINDS_TOKEN}@github.com/Gumbo64/".insteadOf "https://github.com/Gumbo64/"
          fi
      - name: Browser WASM modules (perturbation, web miner)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          REQUIRE_WEBMINER: "1"
        run: npm install -g wasm-pack@0.13.1 && scripts/build-wasm.sh
      - name: Wallet engine (wasm; the desktop app uses wallet-rpc, the engine serves the passkey link page and the browser)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wallet-engine
          path: web/public/wallet
      - run: npm ci
        working-directory: web
      - run: npx vite build --mode desktop
        working-directory: web
        env:
          VITE_SM64COIN_VERSION: ${{ env.VERSION }}
          VITE_GIT_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-desktop
          path: web/dist-desktop
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: [web-desktop, build-linux, build-windows, build-macos]
    if: ${{ !cancelled() }}   # each platform needs its own bundle job; one platform failing does not stop the others
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04      # glibc 2.35, like the bundles
            triple: x86_64-unknown-linux-gnu
            config: linux
            bundles: deb,appimage
            archive: tar.gz
          - platform: windows-x86_64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
            config: windows
            bundles: nsis
            archive: zip
          - platform: macos-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
            config: macos
            bundles: dmg
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Linux packages for Tauri (webkit2gtk 4.1, GTK, appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
          key: desktop-${{ matrix.platform }}
      - uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: bundle-archive
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-desktop
          path: web/dist-desktop
      - name: Unpack the release bundle and stage the sidecars
        run: |
          mkdir bundle
          if [ "${{ matrix.archive }}" = zip ]; then 7z x -y -obundle bundle-archive/*.zip >/dev/null; else tar xzf bundle-archive/*.tar.gz -C bundle; fi
          SRC="$(ls -d bundle/sm64coin-*/ | head -1)"
          desktop/stage-sidecars.sh "$SRC" "${{ matrix.triple }}"
      - name: "Version of the app (tags only, v1.2.3 becomes 1.2.3)"
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            jq --arg v "$v" '.version = $v' desktop/src-tauri/tauri.conf.json > tauri.conf.tmp && mv tauri.conf.tmp desktop/src-tauri/tauri.conf.json
          fi
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.6
      - name: Build the installers
        working-directory: desktop/src-tauri
        env:
          NO_STRIP: "true"   # linuxdeploy (AppImage) cannot strip newer ELF sections
        run: tauri build --target ${{ matrix.triple }} --config bundle/${{ matrix.config }}.json --bundles ${{ matrix.bundles }}
      # Windows portable: the same app without an installer. One folder with SM64Coin.exe, the sidecars (named as the installer
      # names them), their DLLs, seeds.txt and routes/, and the `portable` marker: the app then keeps all its data (chain,
      # wallets, ROM copy, settings, remote-node.txt, the webview's storage) in data/ beside it (desktop.rs `data_dir`).
      # Needs the WebView2 runtime (part of Windows 10 21H2+ / 11; the installer would fetch it).
      - name: Windows portable zip
        if: runner.os == 'Windows'
        run: |
          v="${VERSION#v}"
          name="SM64Coin-$v-windows-x86_64-portable"
          rel="desktop/src-tauri/target/${{ matrix.triple }}/release"
          stage="desktop/src-tauri/stage"
          out="$rel/bundle/portable"
          rm -rf "$out" && mkdir -p "$out/$name/routes"
          # The CLI may already have renamed the cargo binary to the product name.
          exe="$rel/SM64Coin.exe"; [ -f "$exe" ] || exe="$rel/sm64coin-desktop.exe"
          cp "$exe" "$out/$name/SM64Coin.exe"
          for n in sm64coind sm64coin-wallet-rpc sm64coin-automine rrtrun; do cp "$stage/binaries/$n-${{ matrix.triple }}.exe" "$out/$name/$n.exe"; done
          cp "$stage"/dll/*.dll "$out/$name/" 2>/dev/null || true
          cp "$stage/res/seeds.txt" "$out/$name/"
          cp "$stage"/res/routes/* "$out/$name/routes/"
          : > "$out/$name/portable"
          printf '%s\r\n' "SM64Coin $v, portable" "" \
            "Run SM64Coin.exe. Everything the app keeps (chain, wallets, ROM copy, settings) goes in the data folder next to it," \
            "because of the file named 'portable' here; delete that file to use your user profile instead." \
            "Needs the Microsoft Edge WebView2 runtime (built into Windows 11 and current Windows 10)." > "$out/$name/README.txt"
          for f in SM64Coin.exe sm64coind.exe sm64coin-wallet-rpc.exe sm64coin-automine.exe rrtrun.exe seeds.txt portable; do
            [ -f "$out/$name/$f" ] || { echo "portable: $f is missing" >&2; exit 1; }
          done
          (cd "$out" && 7z a -tzip -mx=9 "$name.zip" "$name" >/dev/null)
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/portable/*.zip
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The Android APK (arm64, signed with the release key; see android.yml). Optional like the desktop installers: publish
  # takes it when it was built. The workflow can also be run by hand to test the APK without a release.
  android:
    name: Android APK
    uses: ./.github/workflows/android.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.0.0-test' }}

  publish:
    name: Publish release
    # The draft is made whenever Linux built, with whatever bundles exist: one platform without
    # a runner (macOS capacity) doesn't block the rest. "Re-run failed jobs" adds it later.
    # The desktop installers are optional: publish waits for that job but runs whatever its result (always()), and its
    # download step below is continue-on-error, so the node/wallet bundles are published without them if it failed.
    if: ${{ always() && github.ref_type == 'tag' && needs.build-linux.result == 'success' }}
    needs: [build-linux, build-windows, build-macos, desktop, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Desktop installers (whatever was built)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true
      - name: Android APK (if it was built)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: assets
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - name: Flatten the desktop installers
        # The desktop artifacts keep their build paths (desktop/src-tauri/target/<triple>/release/bundle/...);
        # the release takes only assets/*, so move the installers up. Fail if the desktop job succeeded but
        # no installer arrived (v0.5.1 shipped without them because of this). The Android APK is flattened (and checked) the same way.
        env:
          DESKTOP_OK: ${{ needs.desktop.result == 'success' && 'yes' || '' }}
          ANDROID_OK: ${{ needs.android.result == 'success' && 'yes' || '' }}
        run: |
          find assets -mindepth 2 -type f \( -name 'SM64Coin*' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.apk' \) -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          ls -la assets
          if [ -n "$DESKTOP_OK" ] && [ -z "$(ls assets | grep -E '\.(deb|AppImage|dmg|exe)$|portable\.zip$')" ]; then
            echo "::error::the desktop job succeeded but no installer is in assets/"; exit 1
          fi
          if [ -n "$ANDROID_OK" ] && ! ls assets/sm64coin-*-android.apk >/dev/null 2>&1; then
            echo "::error::the android job succeeded but its APK is not in assets/"; exit 1
          fi
      - name: Checksums
        run: cd assets && sha256sum $(ls sm64coin-* SM64Coin_* SM64Coin-* 2>/dev/null) > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        env:
          MISSING: ${{ needs.build-windows.result != 'success' && 'Windows ' || '' }}${{ needs.build-macos.result != 'success' && 'macOS ' || '' }}${{ needs.desktop.result != 'success' && '(some) desktop app installers ' || '' }}${{ needs.android.result != 'success' && 'Android APK' || '' }}
        run: |
          sed "s/@TAG@/${GITHUB_REF_NAME}/g; s/@VERSION@/${GITHUB_REF_NAME#v}/g" packaging/release-notes.md > notes.md
          if [ -n "$MISSING" ]; then printf '\n**Not built this time:** %s (no runner or a failed build; re-run the failed jobs to add it).\n' "$MISSING" >> notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: notes.md
          draft: true   # review the assets, then press "Publish release"
          prerelease: ${{ contains(github.ref_name, '-') }}

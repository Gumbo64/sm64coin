# The browser wallet engine (web/public/wallet/: the fork's wallet2 as WebAssembly, built by
# scripts/build-wallet-wasm.sh with emscripten). Called by pages.yml and release.yml; uploads the
# artifact `wallet-engine`. Uncached it takes ~30-40 min (boost, openssl, ~600 C++ files), cached a few
# minutes. A failure never fails the caller: the job is allowed to fail, no artifact is uploaded, the
# site is built without the engine and its Wallet page says "wallet engine unavailable".
name: Wallet engine

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The engine's proof_id (web/wallet-wasm/sm64coin_wasm.cpp) against ids the Rust crate computed
  # (web/wallet-wasm/test/vectors-v04.jsonl, from pow/sm64pow/examples/proofid_vectors_v04.rs): a wallet that hashes
  # a proof differently computes other block ids. Native build (asan/ubsan), a few seconds. Not
  # continue-on-error: a drift shows as a failed job (the callers still build the site, see their `if`).
  proof-id:
    name: Wallet proof_id vectors (native)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: The fork's source (monero submodule only, for keccak.c)
        run: git submodule update --init --depth 1 monero
      - name: Boost headers (keccak.c's includes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libboost-dev
      - name: proof_id vectors
        run: WASM=0 web/wallet-wasm/test/run.sh

  engine:
    name: Wallet engine (wasm)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    continue-on-error: true
    env:
      EMSDK_VERSION: 6.0.13   # what the build was developed with; also the cache key (and the emsdk git tag)
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: The fork's source (monero submodule only)
        run: git submodule update --init --depth 1 monero
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # emsdk exactly as on a developer machine (a plain checkout at the version's tag): monero-ts's
      # scripts need $EMSDK/upstream/emscripten and run under sh; setup-emsdk's layout does not fit.
      # NOT named EMSCRIPTEN here: monero-ts reads that variable as emscripten's directory.
      - name: Restore emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk && ./emsdk install "$EMSDK_VERSION" && ./emsdk activate "$EMSDK_VERSION"
      - name: Cache key (script, patch, sources, the fork's commit)
        id: key
        run: echo "k=$(cat scripts/build-wallet-wasm.sh web/wallet-wasm/monero-ts-sm64.patch web/wallet-wasm/sm64coin_wasm.cpp | sha256sum | cut -c1-16)-$(git rev-parse HEAD:monero | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # The work dir holds boost, openssl, the node_modules and the object files; saved even when
      # the build fails or times out so the next run continues from there.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: web/wallet-wasm/work
          key: wallet-wasm-${{ env.EMSDK_VERSION }}-${{ steps.key.outputs.k }}
          restore-keys: |
            wallet-wasm-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build-wallet-wasm.sh', 'web/wallet-wasm/monero-ts-sm64.patch') }}
            wallet-wasm-${{ env.EMSDK_VERSION }}-
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake libssl-dev curl
          source ~/emsdk/emsdk_env.sh
          JOBS=$(nproc) scripts/build-wallet-wasm.sh
      - name: Save the build cache
        if: ${{ always() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: web/wallet-wasm/work
          key: wallet-wasm-${{ env.EMSDK_VERSION }}-${{ steps.key.outputs.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-engine
          path: web/public/wallet
          if-no-files-found: error

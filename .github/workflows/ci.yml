name: CI

# Every push and pull request: the Rust crates build and test, the node script is checked and the website
# build. (The C++ daemon and the wallet are built by release.yml, which takes an hour.)
# ROM-dependent tests skip without a ROM. To run them too, add a repository secret ROM_URL
# pointing at a US baserom.us.z64 (private storage); the step below fetches it when present.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HAS_ROM: ${{ secrets.ROM_URL != '' && 'yes' || '' }}

jobs:
  rust:
    name: Rust (sm64pow, leaderboard, miner)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow
      - name: Prepare the workspace
        run: scripts/ci-prepare.sh
      - name: Fetch the ROM (optional)
        if: ${{ env.HAS_ROM != '' }}
        run: curl -fsSL --proto '=https' --tlsv1.2 "$ROM_URL" -o baserom.us.z64
        env:
          ROM_URL: ${{ secrets.ROM_URL }}
      - name: Test sm64pow
        run: ../scripts/ci-run.sh test-sm64pow cargo test --release -p sm64pow
        working-directory: pow
        env:
          SM64COIN_ROM: ${{ github.workspace }}/baserom.us.z64
      - name: Build the leaderboard server
        run: cargo build --release -p sm64coin-leaderboard
        working-directory: pow
      - name: Build and test the AutoMiner (tests that need a ROM skip without one)
        run: ../scripts/ci-run.sh miner bash -c 'cargo build --release -p sm64coin-miner --bin automine --bin rrtrun && cargo test --release -p sm64coin-miner'
        working-directory: pow
        env:
          SM64COIN_ROM: ${{ github.workspace }}/baserom.us.z64
      - name: Check the node script
        run: |
          bash -n scripts/sm64coin-node scripts/package.sh scripts/ci-smoke.sh
          scripts/sm64coin-node --help

  web:
    name: Website
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the replay player and its dependencies (sibling checkouts)
        run: scripts/ci-prepare.sh --web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow/perturb-wasm
            pow/webminer
          key: wasm
      # The web miner (pow/webminer) needs clang for wasm32 (zstd-sys) and the obrrt crates from
      # Gumbo64/sm64-AI-binds. If that repo is private, add the repo secret SM64_AI_BINDS_TOKEN
      # (a read-only token); without it the git fetch is anonymous. A failed web miner build
      # never fails this job (scripts/build-wasm.sh tolerates it; the site works without it).
      - name: Toolchain for the web miner (clang, llvm, private repo access)
        continue-on-error: true
        env:
          SM64_AI_BINDS_TOKEN: ${{ secrets.SM64_AI_BINDS_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          if [ -n "$SM64_AI_BINDS_TOKEN" ]; then
            git config --global url."https://x-access-token:${SM64_AI_BINDS_TOKEN}@github.com/Gumbo64/".insteadOf "https://github.com/Gumbo64/"
          fi
      - name: Browser WASM modules (perturbation, web miner)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          REQUIRE_WEBMINER: "1"
        run: npm install -g wasm-pack@0.13.1 && scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Node tests
        run: |
          node src/lib/resetPolicy.test.mjs
          node src/lib/webminer/hybrid.test.mjs
        working-directory: web

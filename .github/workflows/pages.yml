# The website on GitHub Pages (https://<owner>.github.io/<repo>/). It is static: the pages
# call a node's RPC from the visitor's browser, by default the visitor's own node at
# http://127.0.0.1:16481 (start it with --rpc-access-control-origins https://<owner>.github.io;
# see README "Website on GitHub Pages"). One-time setup: Settings -> Pages -> Source: GitHub Actions
# (not "Deploy from a branch", which publishes the README with Jekyll instead).
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'pow/perturb/**', 'pow/perturb-wasm/**', 'pow/statecodec/**', 'scripts/build-wasm.sh', 'scripts/build-wallet-wasm.sh', 'monero', '.github/workflows/pages.yml', '.github/workflows/wallet-engine.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  wallet-engine:
    uses: ./.github/workflows/wallet-engine.yml

  build:
    needs: wallet-engine
    if: ${{ !cancelled() }}   # the site is deployed even when the wallet engine failed to build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pow/perturb-wasm
            pow/webminer
          key: wasm
      # The web miner (pow/webminer) needs clang for wasm32 (zstd-sys) and the obrrt crates from
      # Gumbo64/sm64-AI-binds. If that repo is private, add the repo secret SM64_AI_BINDS_TOKEN
      # (a read-only token); without it the git fetch is anonymous. A failed web miner build
      # never fails this job (scripts/build-wasm.sh tolerates it; the site works without it).
      - name: Toolchain for the web miner (clang, llvm, private repo access)
        continue-on-error: true
        env:
          SM64_AI_BINDS_TOKEN: ${{ secrets.SM64_AI_BINDS_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          if [ -n "$SM64_AI_BINDS_TOKEN" ]; then
            git config --global url."https://x-access-token:${SM64_AI_BINDS_TOKEN}@github.com/Gumbo64/".insteadOf "https://github.com/Gumbo64/"
          fi
      - name: Browser WASM modules (perturbation, web miner)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: npm install -g wasm-pack@0.13.1 && scripts/build-wasm.sh
      - name: Wallet engine (wasm); without it the Wallet page says it is unavailable
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wallet-engine
          path: web/public/wallet
      - run: npm ci
        working-directory: web
      - name: Build for /<repo>/, the visitor's own node by default
        run: npm run build && cp dist/index.html dist/404.html   # 404.html: deep links fall back to the app
        working-directory: web
        env:
          SM64COIN_BASE: /${{ github.event.repository.name }}/
          VITE_DEFAULT_NODE: http://127.0.0.1:16481
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "sm64coin"
version = "0.1.0"
description = "Write Super Mario 64 bots that mine SM64Coin: the perturbation contract, a daemon client and offline practice"
requires-python = ">=3.9"
dependencies = ["sm64-binds==2.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

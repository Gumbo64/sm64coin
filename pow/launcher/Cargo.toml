[package]
name = "sm64coin-launcher"
version = "0.2.2"
edition = "2024"
description = "sm64coin: one command that finds the ROM, runs the node, serves the website and opens the wallet"
license = "BSD-3-Clause"

[lib]
name = "sm64coin_launcher"
path = "src/lib.rs"

[[bin]]
name = "sm64coin"
path = "src/main.rs"
required-features = ["desktop"]

# Its own workspace (own Cargo.lock): it needs none of the consensus crates, so it
# builds anywhere, quickly, and the release bundle's launcher is independent of them.
[workspace]

# `tls`: https for rpc::call_url (the desktop app talks to the public node).
[features]
default = ["desktop", "lc"]
# `desktop`: everything that needs a desktop OS (ROM search, node/child processes, DHT seeds) and the CLI. Without it only
# `rpc` (and `util`) are built: the Android app uses just the whitelisted remote RPC.
desktop = ["dep:clap", "dep:ctrlc", "dep:sha1", "dep:mainline", "dep:tiny_http"]
# `lc`: the light-client service (sm64coin-lc: the tip pushed over HTTP, Server-Sent Events) run next to the node (`--lc`).
lc = ["desktop", "dep:tokio", "sm64coin-lc/tip-server"]
tls = ["ureq/tls"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = { version = "0.10", optional = true }
mainline = { version = "8", optional = true }
tiny_http = { version = "0.12", optional = true }
ureq = { version = "2", default-features = false }
# PCP mapping nonces and UPnP external-port candidates need randomness.
getrandom = "0.2"
# The RPC allowlist lives in the light-client crate (one list for the launcher, the service and the apps).
sm64coin-lc = { path = "../lc", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

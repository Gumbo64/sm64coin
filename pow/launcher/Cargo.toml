[package]
name = "sm64coin-launcher"
version = "0.2.2"
edition = "2024"
description = "sm64coin: one command that finds the ROM, runs the node, serves the website and opens the wallet"
license = "BSD-3-Clause"

[lib]
name = "sm64coin_launcher"
path = "src/lib.rs"

[[bin]]
name = "sm64coin"
path = "src/main.rs"

# Its own workspace (own Cargo.lock): it needs none of the consensus crates, so it
# builds anywhere, quickly, and the release bundle's launcher is independent of them.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
mainline = "8"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

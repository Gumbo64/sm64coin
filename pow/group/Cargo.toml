[package]
name = "sm64coin-group"
version = "0.1.0"
edition = "2024"
description = "Group mining for SM64Coin: trusted members mine one block template together over iroh-gossip"

[dependencies]
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.103.0", default-features = false, features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
data-encoding = "2"
flate2 = "1"
blake3 = "1"
anyhow = "1"
bytes = "1"
n0-future = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
rand = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

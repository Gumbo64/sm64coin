[package]
name = "sm64coin-lc-wasm"
version = "0.1.0"
edition = "2024"
description = "The SM64Coin light-client network for the browser: node list, failover, HTTPS, header verification (wraps sm64coin-lc)"
license = "BSD-3-Clause"

# Its own workspace (own Cargo.lock): the lock pins wasm-bindgen 0.2.108 (wasmer 6.1.0's JS backend, pulled in by the
# consensus rules, does not build against a newer one). Not the same lock as pow/lc or pow/webminer.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["consensus"]
# The real consensus rules (sm64pow): difficulty, frame limit, signatures, proof weight, fork choice.
# Without it header verification is structural only (linkage, ids, timestamps).
consensus = ["sm64coin-lc/consensus"]

[dependencies]
sm64coin-lc = { path = "../lc" }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal"] }
serde_json = "1"
async-trait = "0.1"
hex = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures-executor = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["sm64pow", "perturb", "miner", "leaderboard", "sdk"]
exclude = ["perturb-wasm"]
resolver = "3"

[workspace.dependencies]
# The game build is consensus-critical (sm64pow::GAME_BUILD checks it at startup).
# Until the rng-free sm64-binds is released, build next to a checkout of it:
# ../../sm64-binds = github.com/Gumbo64/sm64-binds at main.
sm64-binds = { version = "2.0.1", path = "../../sm64-binds/rust" }
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

[workspace]
members = ["sm64pow", "perturb", "miner", "leaderboard", "sdk"]
exclude = ["vendor", "perturb-wasm"]
resolver = "3"

[workspace.dependencies]
sm64-binds = "2.0.1" # resolved to /workspaces/sm64-combined/sm64-binds/rust by the [patch.crates-io] in /workspaces/sm64-combined/.cargo/config.toml (one game build for the miner and the research crates)
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

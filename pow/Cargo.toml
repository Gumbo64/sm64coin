[workspace]
members = ["sm64pow", "perturb", "statecodec", "miner", "leaderboard", "sdk"]
exclude = ["perturb-wasm"]
resolver = "3"

[workspace.dependencies]
# The game build is consensus-critical (sm64pow::GAME_BUILD checks it at startup).
# The game build is consensus-critical (sm64pow::GAME_BUILD checks it at startup): pin exactly.
# Local development: the workspace-level .cargo/config.toml may patch crates-io to a sibling
# ../sm64-binds checkout (same game build).
sm64-binds = { version = "=2.1.2", default-features = false }
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

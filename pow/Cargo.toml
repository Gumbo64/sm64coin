[workspace]
members = ["sm64pow", "perturb", "miner", "leaderboard", "sdk"]
exclude = ["vendor", "perturb-wasm"]
resolver = "3"

[workspace.dependencies]
sm64-binds = { path = "vendor/sm64-binds" } # consensus-critical: the game build is vendored (sm64-binds branch sm64coin)
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

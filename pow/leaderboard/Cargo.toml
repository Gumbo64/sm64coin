[package]
name = "sm64coin-leaderboard"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sm64coin-leaderboard"
path = "src/main.rs"

[dependencies]
curve25519-dalek = "4"
sha3 = "0.10"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }

[package]
name = "sm64pow"
version = "0.1.0"
edition = "2024"
description = "SM64Coin proof-of-play: consensus parameters and replay verification"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Hard fork switch (on by default since the state-codec hard fork): accept
# state-aware codecs (statecodec.rs, statemix.rs) in blocks and let sealing
# pick them. Built without it, nodes reject them like any unknown id.
default = ["state-codec"]
state-codec = []

[dependencies]
sm64coin-statecodec = { path = "../statecodec" }
sm64-binds = { workspace = true }
anyhow = { workspace = true }
sha3 = "0.10"
xz2 = { version = "0.1", features = ["static"] }
serde = { version = "1", features = ["derive"] }
sm64coin-perturb = { path = "../perturb" }

[dev-dependencies]
serde_json = "1"

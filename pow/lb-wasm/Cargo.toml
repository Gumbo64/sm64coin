[package]
name = "sm64lb-wasm"
version = "0.1.0"
edition = "2024"
description = "The on-chain leaderboard check (sm64lb) for the browser: the same code as the leaderboard server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sm64lb = { path = "../sm64lb" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true

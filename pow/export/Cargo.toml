[package]
name = "sm64coin-export"
version = "0.1.0"
edition = "2024"
description = "SM64Coin chain-to-dataset export: effective inputs as m64, per-block segments, start states, per-frame features"

[lib]
name = "sm64coin_export"
path = "src/lib.rs"

[[bin]]
name = "sm64coin-export"
path = "src/main.rs"

[dependencies]
sm64pow = { path = "../sm64pow" }
sm64-binds = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
flate2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }

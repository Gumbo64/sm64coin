[package]
name = "sm64coin-sdk"
version = "0.1.0"
edition = "2024"
description = "SDK for writing SM64Coin mining bots: the perturbation contract, a daemon client and a miner loop"

[dependencies]
sm64pow = { path = "../sm64pow" }
sm64-binds = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
rand = "0.9"

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32, the web miner): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# Only the fixture generator example (examples/make_fixture.rs) uses the
# built-in miner's search.
sm64coin-miner = { path = "../miner" }

[package]
name = "sm64coin-miner"
version = "0.1.0"
edition = "2024"

[dependencies]
sm64pow = { path = "../sm64pow" }
sm64lb = { path = "../sm64lb" }
sm64-binds = { workspace = true }
# The user's research crates (objective-rrt-v2): the rolling-horizon GA over SM64MiningGame (feature sm64coin).
obrrt-core = { path = "/workspaces/sm64-combined/sm64-AI-binds/objective-rrt-v2/core" }
obrrt-search = { path = "/workspaces/sm64-combined/sm64-AI-binds/objective-rrt-v2/search", features = ["sm64coin"] }
obrrt-spec = { path = "/workspaces/sm64-combined/sm64-AI-binds/objective-rrt-v2/spec" }
obrrt-objectives = { path = "/workspaces/sm64-combined/sm64-AI-binds/objective-rrt-v2/objectives" }
rayon = "1"
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }


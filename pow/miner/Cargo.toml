[package]
name = "sm64coin-miner"
version = "0.1.0"
edition = "2024"

[dependencies]
sm64pow = { path = "../sm64pow", features = ["normalise"] }
sm64-binds = { workspace = true }
# The search crates (objective-rrt-v2 in github.com/Gumbo64/sm64-AI-binds): the rolling-horizon
# GA and the state tree, over a HookedGame whose step hook is the SM64Coin perturbation
# (src/hook.rs). A clone builds them from GitHub at the pinned commit; to build against a
# local checkout instead, add to a .cargo/config.toml above this repo:
#   [patch."https://github.com/Gumbo64/sm64-AI-binds"]
#   obrrt-core = { path = ".../sm64-AI-binds/objective-rrt-v2/core" }   (and -search, -spec, -objectives)
obrrt-core = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "49187107ac6a1c4e6a0a71dafdb712dea0742a7e" }
obrrt-search = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "49187107ac6a1c4e6a0a71dafdb712dea0742a7e", features = ["hooked"] }
obrrt-spec = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "49187107ac6a1c4e6a0a71dafdb712dea0742a7e" }
obrrt-objectives = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "49187107ac6a1c4e6a0a71dafdb712dea0742a7e" }
rayon = "1"
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.9"

# Native: sm64-binds' default backend (wasmer sys); the browser (wasm32, the web miner): wasmer's JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sm64-binds = { workspace = true, features = ["default"] }
# The node RPC client and the command lines: native only (in the browser the page talks to the node).
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sm64-binds = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = "0.2"

[package]
name = "sm64coin-miner"
version = "0.1.0"
edition = "2024"

[dependencies]
sm64pow = { path = "../sm64pow" }
sm64-binds = { workspace = true }
# The search crates (objective-rrt-v2 in github.com/Gumbo64/sm64-AI-binds): the rolling-horizon
# GA and the state tree, over a HookedGame whose step hook is the SM64Coin perturbation
# (src/hook.rs). A clone builds them from GitHub at the pinned commit; to build against a
# local checkout instead, add to a .cargo/config.toml above this repo:
#   [patch."https://github.com/Gumbo64/sm64-AI-binds"]
#   obrrt-core = { path = ".../sm64-AI-binds/objective-rrt-v2/core" }   (and -search, -spec, -objectives)
obrrt-core = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
obrrt-search = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118", features = ["hooked"] }
obrrt-spec = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
obrrt-objectives = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
rayon = "1"
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
rand = "0.9"
clap = { version = "4", features = ["derive"] }


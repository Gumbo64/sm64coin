[package]
name = "sm64coin-lc"
version = "0.1.0"
edition = "2024"
description = "SM64Coin light-client network over HTTP(S): node list and failover, header verification, the tip feed service (Server-Sent Events)"
license = "BSD-3-Clause"

# Its own workspace (own Cargo.lock), like the launcher: no consensus crates needed.
[workspace]

[lib]
name = "sm64coin_lc"
path = "src/lib.rs"

[[bin]]
name = "sm64coin-lc"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = []
# Native HTTP JSON-RPC transport (ureq).
http = ["dep:ureq", "dep:tokio", "tokio/rt", "tokio/time", "tokio/sync"]
# The tip service: the shared watcher (tipfeed.rs) and Server-Sent Events over HTTP (sse.rs).
tip-server = ["http", "tokio/net", "tokio/macros", "tokio/io-util", "dep:tokio-rustls", "dep:rustls", "dep:rustls-pki-types"]
# https for the HTTP transport.
tls = ["ureq/tls"]
# Consensus rules for the verifier from sm64pow (difficulty, frame limit, signatures, proof weight, fork choice).
# Links the game crate (sm64-binds) but runs no emulation. Without it the verifier is structural only.
consensus = ["dep:sm64pow"]
# Replaying Mario runs with sm64pow's verifier (needs the ROM at runtime).
replay = ["consensus"]
bin = ["tip-server", "tls", "dep:clap", "dep:tracing", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha3 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
tracing = { version = "0.1", optional = true }
sm64pow = { path = "../sm64pow", optional = true }
tokio = { version = "1", default-features = false, features = [], optional = true }
ureq = { version = "2", default-features = false, optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["full"] }

[[test]]
name = "sse"
required-features = ["tip-server"]

[[test]]
name = "http"
required-features = ["tip-server"]

[[example]]
name = "ssesrv"
required-features = ["tip-server"]

[[example]]
name = "checkpoint"
required-features = ["http", "tls", "consensus"]

[[test]]
name = "verify"
required-features = ["consensus"]

[[test]]
name = "replay"
required-features = ["replay"]

[[test]]
name = "tls"
required-features = ["tip-server"]

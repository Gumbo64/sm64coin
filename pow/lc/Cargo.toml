[package]
name = "sm64coin-lc"
version = "0.1.0"
edition = "2024"
description = "SM64Coin light-client network: wire protocol, node list, transports (HTTP and iroh), the iroh service and relay"
license = "BSD-3-Clause"

# Its own workspace (own Cargo.lock), like the launcher: no consensus crates needed.
[workspace]

[lib]
name = "sm64coin_lc"
path = "src/lib.rs"

[[bin]]
name = "sm64coin-lc"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = []
# Native HTTP JSON-RPC transport (ureq).
http = ["dep:ureq", "dep:tokio", "tokio/rt"]
# https for the HTTP transport.
tls = ["ureq/tls"]
tokio-io = ["dep:tokio", "tokio/io-util"]
# The iroh client transport (works natively and, with default features off, in the browser).
iroh-client = ["dep:iroh", "dep:rustls-pki-types", "dep:iroh-relay", "dep:n0-future", "tokio-io", "tokio/sync"]
# The service: iroh endpoint answering from the local node's RPC.
server = ["iroh-client", "http", "tokio/net", "tokio/time", "tokio/sync", "tokio/rt-multi-thread"]
# Embedded iroh-relay server.
relay = ["server", "iroh-relay/server", "dep:rustls", "dep:rcgen", "rustls-pki-types/std"]
# Mainline-DHT address lookup (desktop / nodes only, never Android).
dht = ["iroh-client", "dep:iroh-mainline-address-lookup"]
# Consensus rules for the verifier from sm64pow (difficulty, frame limit, signatures, proof weight, fork choice).
# Links the game crate (sm64-binds) but runs no emulation. Without it the verifier is structural only.
consensus = ["dep:sm64pow"]
# Replaying Mario runs with sm64pow's verifier (needs the ROM at runtime).
replay = ["consensus"]
bin = ["relay", "dht", "tls", "dep:clap", "dep:tracing-subscriber", "tokio/macros", "tokio/signal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
hex = "0.4"
sha3 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false }
async-trait = "0.1"
tracing = "0.1"
sm64pow = { path = "../sm64pow", optional = true }
# pinned: the wire-stable 1.x line
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
n0-future = { version = "0.3", optional = true }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["tls-ring"], optional = true }
iroh-mainline-address-lookup = { version = "=0.6.1", optional = true }
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }
ureq = { version = "2", default-features = false, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[test]]
name = "net"
required-features = ["relay"]

[[example]]
name = "client"
required-features = ["relay"]

[[example]]
name = "checkpoint"
required-features = ["http", "tls", "consensus"]

[[test]]
name = "verify"
required-features = ["consensus"]

[[test]]
name = "replay"
required-features = ["replay"]

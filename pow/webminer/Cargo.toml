[package]
name = "sm64coin-webminer"
version = "0.1.0"
edition = "2024"
description = "The SM64Coin automated miner (the RRT campaign search) in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obrrt-core = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
obrrt-search = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118", features = ["hooked"] }
obrrt-spec = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
obrrt-objectives = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "626869369bc9d9f61e940cff0494cbc13f57e118" }
wasm-bindgen = "0.2"
sm64pow = { path = "../sm64pow" }
sm64coin-miner = { path = "../miner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

# Its own workspace: the browser build swaps crates for every dependency at once.
[workspace]

[patch.crates-io]
rayon = { path = "rayon-seq" }
sm64-binds = { path = "/workspaces/sm64-combined/sm64-binds-webjs211/rust" }

[patch."https://github.com/Gumbo64/sm64-AI-binds"]
obrrt-core = { path = "/workspaces/sm64-combined/sm64-AI-binds-web/objective-rrt-v2/core" }
obrrt-search = { path = "/workspaces/sm64-combined/sm64-AI-binds-web/objective-rrt-v2/search" }
obrrt-spec = { path = "/workspaces/sm64-combined/sm64-AI-binds-web/objective-rrt-v2/spec" }
obrrt-objectives = { path = "/workspaces/sm64-combined/sm64-AI-binds-web/objective-rrt-v2/objectives" }

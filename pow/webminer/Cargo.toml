[package]
name = "sm64coin-webminer"
version = "0.1.0"
edition = "2024"
description = "The SM64Coin automated miner (the RRT campaign search) in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obrrt-core = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "3d708c3ea0167031acdfd1e6412875995cca841f" }
obrrt-search = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "3d708c3ea0167031acdfd1e6412875995cca841f", features = ["hooked"] }
obrrt-spec = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "3d708c3ea0167031acdfd1e6412875995cca841f" }
obrrt-objectives = { git = "https://github.com/Gumbo64/sm64-AI-binds", rev = "3d708c3ea0167031acdfd1e6412875995cca841f" }
wasm-bindgen = "0.2"
sm64pow = { path = "../sm64pow" }
sm64coin-miner = { path = "../miner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

# Its own workspace: the browser build swaps crates for every dependency at once.
[workspace]

# CI/clean-clone build: everything from pinned git revisions (the two web branches below must
# be pushed). For local development .cargo/config.toml (uncommitted, absolute paths to the
# worktrees) overrides the sm64-binds patch and the obrrt crates; config [patch] takes
# precedence over the manifest's.
# obrrt-*: Gumbo64/sm64-AI-binds branch `web-miner` (pinned above by rev).
[patch.crates-io]
rayon = { path = "rayon-seq" }
# sm64-binds 2.1.1 with the JS-backend memory fix: Gumbo64/sm64-binds branch `wasm-js-memory-2.1.1`.
sm64-binds = { git = "https://github.com/Gumbo64/sm64-binds", rev = "14037c51dc841034265e294311508eeb6d42ca3e" }
